repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: remove-crlf
      - id: forbid-crlf
  - repo: local
    hooks:
      - id: stylua
        name: StyLua
        language: system
        entry: stylua
        types: [lua]
        verbose: true
      - id: selene
        name: Selene
        language: system
        entry: selene
        files: ^lua/.*\.lua$
        types: [lua]
        verbose: true
      - id: run_tests
        name: Run Tests
        language: system
        entry: make test
        files: ^(lua|spec)/.*\.lua$
        types: [lua]
        verbose: true
